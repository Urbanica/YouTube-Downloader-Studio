name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify version and release notes
        id: release_notes
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $source = Get-Content -Raw main.py
          if ($source -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            throw "APP_VERSION was not found in main.py."
          }
          if ($Matches[1] -ne $tagVersion) {
            throw "Tag version $tagVersion does not match APP_VERSION $($Matches[1])."
          }

          $changelog = Get-Content -Raw CHANGELOG.md
          $pattern = "(?ms)^## \[$([regex]::Escape($tagVersion))\].*?\r?\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success -or [string]::IsNullOrWhiteSpace($match.Groups[1].Value)) {
            throw "Release notes for version $tagVersion were not found in CHANGELOG.md."
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $match.Groups[1].Value.Trim() -Encoding utf8
          "body_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.22,<7"

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean "YouTube Downloader Studio.spec"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: YouTube Downloader Studio ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          files: dist/YouTube Downloader Studio.exe
          fail_on_unmatched_files: true
          make_latest: true
